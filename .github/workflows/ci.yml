name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Both jobs run scripts/verify.sh, the same gate as on a developer's machine. Tool versions are
# pinned here so a runner image update can't change what is checked: Xcode (setup-xcode), the JDK
# (setup-java, matching gradle/gradle-daemon-jvm.properties) and XcodeGen (iosApp/.xcodegen-version).
env:
  XCODE_VERSION: "27.1"
  IOS_TEST_DEVICE: "iPhone 18 Pro"

jobs:
  kotlin:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: scripts/verify.sh kotlin

  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the pinned XcodeGen
        run: |
          version=$(cat iosApp/.xcodegen-version)
          curl -fsSL -o /tmp/xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/$version/xcodegen.zip"
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          echo "/tmp/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - run: scripts/verify.sh ios
