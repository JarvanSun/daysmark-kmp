<svg xmlns="http://www.w3.org/2000/svg" width="680" height="464" viewBox="0 0 680 464" role="img">
  <title>Daysmark module architecture</title>
  <desc>The Android app (Jetpack Compose) and the iOS app (SwiftUI) both depend on the shared module, which holds the Metro graph and builds the iOS framework. shared depends on feature:events and core:data; both depend on core:domain, which is pure Kotlin.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; dominant-baseline: central; }
    .title { font-size: 14px; font-weight: 500; }
    .sub { font-size: 12px; }
    .note { font-size: 12px; fill: #5F5E5A; }
    .arrow { stroke: #888780; stroke-width: 1.5; fill: none; }
    .frame { fill: none; stroke: #888780; stroke-width: 1; stroke-dasharray: 4 4; }
    .purple rect { fill: #EEEDFE; stroke: #534AB7; } .purple .title { fill: #3C3489; } .purple .sub { fill: #534AB7; }
    .teal rect { fill: #E1F5EE; stroke: #0F6E56; } .teal .title { fill: #085041; } .teal .sub { fill: #0F6E56; }
    .gray rect { fill: #F1EFE8; stroke: #5F5E5A; } .gray .title { fill: #2C2C2A; } .gray .sub { fill: #5F5E5A; }
    .coral rect { fill: #FAECE7; stroke: #993C1D; } .coral .title { fill: #712B13; } .coral .sub { fill: #993C1D; }
    @media (prefers-color-scheme: dark) {
      .arrow, .frame { stroke: #B4B2A9; }
      .note { fill: #D3D1C7; }
      .purple rect { fill: #3C3489; stroke: #AFA9EC; } .purple .title { fill: #EEEDFE; } .purple .sub { fill: #CECBF6; }
      .teal rect { fill: #085041; stroke: #5DCAA5; } .teal .title { fill: #E1F5EE; } .teal .sub { fill: #9FE1CB; }
      .gray rect { fill: #444441; stroke: #B4B2A9; } .gray .title { fill: #F1EFE8; } .gray .sub { fill: #D3D1C7; }
      .coral rect { fill: #712B13; stroke: #F0997B; } .coral .title { fill: #FAECE7; } .coral .sub { fill: #F5C4B3; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g class="purple">
    <rect x="50" y="40" width="270" height="56" rx="8" stroke-width="0.5"/>
    <text class="title" x="185" y="58" text-anchor="middle">androidApp</text>
    <text class="sub" x="185" y="78" text-anchor="middle">Jetpack Compose, Glance widget, alarms</text>
  </g>
  <g class="purple">
    <rect x="360" y="40" width="270" height="56" rx="8" stroke-width="0.5"/>
    <text class="title" x="495" y="58" text-anchor="middle">iosApp</text>
    <text class="sub" x="495" y="78" text-anchor="middle">SwiftUI, WidgetKit, notifications</text>
  </g>

  <line class="arrow" x1="185" y1="96" x2="185" y2="160" marker-end="url(#arrow)"/>
  <line class="arrow" x1="495" y1="96" x2="495" y2="160" marker-end="url(#arrow)"/>
  <text class="note" x="501" y="128">iOS framework</text>

  <rect class="frame" x="30" y="140" width="620" height="304" rx="16"/>
  <text class="note" x="46" y="128">Kotlin Multiplatform</text>

  <g class="teal">
    <rect x="50" y="162" width="580" height="56" rx="8" stroke-width="0.5"/>
    <text class="title" x="340" y="180" text-anchor="middle">shared</text>
    <text class="sub" x="340" y="200" text-anchor="middle">Metro dependency graph, app-wide services, Swift-facing API</text>
  </g>

  <line class="arrow" x1="185" y1="218" x2="185" y2="262" marker-end="url(#arrow)"/>
  <line class="arrow" x1="495" y1="218" x2="495" y2="262" marker-end="url(#arrow)"/>

  <g class="gray">
    <rect x="50" y="264" width="270" height="56" rx="8" stroke-width="0.5"/>
    <text class="title" x="185" y="282" text-anchor="middle">feature:events</text>
    <text class="sub" x="185" y="302" text-anchor="middle">ViewModels, UI state, actions</text>
  </g>
  <g class="gray">
    <rect x="360" y="264" width="270" height="56" rx="8" stroke-width="0.5"/>
    <text class="title" x="495" y="282" text-anchor="middle">core:data</text>
    <text class="sub" x="495" y="302" text-anchor="middle">Room (KMP), repositories</text>
  </g>

  <line class="arrow" x1="185" y1="320" x2="185" y2="364" marker-end="url(#arrow)"/>
  <line class="arrow" x1="495" y1="320" x2="495" y2="364" marker-end="url(#arrow)"/>

  <g class="coral">
    <rect x="50" y="366" width="580" height="56" rx="8" stroke-width="0.5"/>
    <text class="title" x="340" y="384" text-anchor="middle">core:domain</text>
    <text class="sub" x="340" y="404" text-anchor="middle">Pure Kotlin: models, date rules, repository and platform interfaces</text>
  </g>
</svg>
